# Publish to PyPI when a GitHub release is published.
#
# The upload uses PyPI's trusted publishing: PyPI is told once that this repository,
# this workflow file and the `pypi` environment may publish
# `LMID-conformally-flat-puncture`, and the job proves its identity with a short-lived
# OIDC token.  No API token is stored anywhere.
#
# The build job refuses to publish a wheel that does not match the release: the tag
# must be `v` + the version in pyproject.toml, and the wheel is installed from PyPI's
# dependencies into a fresh environment and imported through both namespace levels
# (the lazy idiom that a namespace-ownership mistake breaks while direct imports keep
# working).  A PyPI version can never be uploaded twice, so these checks run first.
name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag names the version being built
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag $TAG, pyproject $v"
          test "$TAG" = "v$v"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the wheel into a fresh environment and import it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "
          import lemaitre as lm
          m = lm.initial_data.conformally_flat_puncture
          print(m.__file__, m.__version__)
          m.models, m.solver.solver_3d
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/LMID-conformally-flat-puncture
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
